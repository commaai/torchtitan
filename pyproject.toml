# ---- All project specifications ---- #
[project]
name = "torchtitan"
description = "A PyTorch native platform for training generative AI models"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    { name = "PyTorch Team", email = "packages@pytorch.org" },
]
keywords = ["pytorch", "training", "llm"]
# Dependencies are read from the requirement files so pip, uv, CI and the
# Docker image (whose build context is .ci/docker) share one source of truth.
dynamic = ["version", "dependencies"]

[project.urls]
GitHub = "https://github.com/pytorch/torchtitan"
Documentation = "https://github.com/pytorch/torchtitan/tree/main/docs"
Issues = "https://github.com/pytorch/torchtitan/issues"

[tool.setuptools.dynamic]
version = {file = "assets/version.txt"}
dependencies = {file = ["requirements.txt"]}

[tool.codespell]
skip = ["*.json"]
ignore-words-list = ["assertin", "datas" ,"indx", "inpt", "nd", "socio-economic"]

# ---- Explicit project build information ---- #
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [""]
# torchtitan_recipes is a second top-level package, listed so that
# tightening the first pattern to "torchtitan.*" cannot silently drop it.
include = ["torchtitan*", "torchtitan_recipes*"]

[tool.pytest.ini_options]
addopts = ["--showlocals"]  # show local variables in tracebacks
testpaths = ["tests"]
markers = [
    "multi_gpu: tests that require multiple physical GPUs",
]

[tool.pyrefly]
python-version = "3.11"
project-excludes = ["torchtitan/experiments", "torchtitan/rl", "**/tests/**"]
replace-imports-with-any = [
    "torchao.*", "torchft", "torchvision.*", "deep_ep.*", "jinja2.*", "helion", "helion.*", "batch_invariant_ops", "verifiers.*", # optional dependencies
    "dist_moe", "dist_moe.*", # optional dependency without Pyrefly stubs
    # torch_remat is required, but does not publish Pyrefly stubs.
    "torch_remat",
]
search-path = ["../pytorch"]  # local built pytorch

[[tool.pyrefly.sub-config]]
matches = "torchtitan/distributed/deepep/hybridep.py"

[tool.pyrefly.sub-config.errors]
missing-module-attribute = false
